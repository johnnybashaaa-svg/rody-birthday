<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رودي ❤️ عيد ميلاد سعيد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            background: #0a0e27;
        }

        /* ===== GLOBALS ===== */
        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .scene.active {
            opacity: 1;
        }

        /* ===== SCENE 1: STARRY NIGHT ===== */
        #scene1 {
            background: radial-gradient(ellipse at 50% 50%, #1a1a3e 0%, #0a0e27 50%, #050810 100%);
        }

        .starfield {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8));
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.3)); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 1)); }
        }

        .star {
            animation: twinkle var(--duration) infinite;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(200, 150, 255, 0.8), rgba(200, 150, 255, 0.2));
            border-radius: 50%;
            filter: drop-shadow(0 0 6px rgba(200, 150, 255, 0.6));
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5);
                opacity: 0;
            }
        }

        .particle {
            animation: float var(--duration) infinite linear;
        }

        .scene1-content {
            text-align: center;
            z-index: 10;
            animation: fadeInScale 1.2s ease-out 0.5s both;
        }

        .glow-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            background: linear-gradient(135deg, #c1a8ff 0%, #ff6ee7 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(193, 168, 255, 0.6)) drop-shadow(0 0 40px rgba(255, 110, 231, 0.4));
            letter-spacing: 2px;
            margin-bottom: 3rem;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(193, 168, 255, 0.6)) drop-shadow(0 0 40px rgba(255, 110, 231, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(193, 168, 255, 0.8)) drop-shadow(0 0 60px rgba(255, 110, 231, 0.6)); }
        }

        .glow-button {
            padding: 1rem 2.5rem;
            font-size: clamp(1rem, 3vw, 1.3rem);
            background: linear-gradient(135deg, rgba(193, 168, 255, 0.2), rgba(255, 110, 231, 0.2));
            border: 2px solid;
            border-image: linear-gradient(135deg, #c1a8ff, #ff6ee7, #00d4ff) 1;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(193, 168, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeInScale 1.2s ease-out 1s both;
        }

        .glow-button:hover {
            background: linear-gradient(135deg, rgba(193, 168, 255, 0.4), rgba(255, 110, 231, 0.4));
            box-shadow: 0 15px 40px rgba(193, 168, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .glow-button:active {
            transform: translateY(-1px);
        }

        /* ===== SCENE 2: PHOTO & GREETING ===== */
        #scene2 {
            background: radial-gradient(ellipse at 50% 30%, rgba(147, 51, 234, 0.15) 0%, rgba(59, 130, 246, 0.1) 30%, #0a0e27 100%);
            flex-direction: column;
            gap: 2rem;
        }

        .photo-frame {
            position: relative;
            width: clamp(150px, 40vw, 300px);
            height: clamp(150px, 40vw, 300px);
            animation: fadeInScale 0.8s ease-out both;
        }

        .neon-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #c1a8ff 0deg,
                #ff6ee7 90deg,
                #00d4ff 180deg,
                #7c3aed 270deg,
                #c1a8ff 360deg
            );
            padding: 3px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .neon-circle::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(147, 51, 234, 0.3), #0a0e27);
        }

        .photo-img {
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(193, 168, 255, 0.5), inset 0 0 40px rgba(255, 110, 231, 0.2);
            animation: photoGlow 2s ease-in-out infinite;
        }

        @keyframes photoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(193, 168, 255, 0.5), inset 0 0 40px rgba(255, 110, 231, 0.2); }
            50% { box-shadow: 0 0 60px rgba(193, 168, 255, 0.8), inset 0 0 60px rgba(255, 110, 231, 0.4); }
        }

        .greeting-text {
            font-size: clamp(1.3rem, 4vw, 2rem);
            font-weight: 600;
            background: linear-gradient(135deg, #c1a8ff 0%, #ff6ee7 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(193, 168, 255, 0.3);
            animation: fadeInScale 0.8s ease-out 0.3s both;
            letter-spacing: 1px;
        }

        /* ===== SCENE 3: OPEN GIFT ===== */
        #scene3 {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2) 0%, rgba(59, 130, 246, 0.15) 50%, #0a0e27 100%);
        }

        .gift-box {
            position: relative;
            width: clamp(120px, 30vw, 250px);
            height: clamp(120px, 30vw, 250px);
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .gift-box-shape {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6ee7 0%, #c1a8ff 100%);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 20px 60px rgba(255, 110, 231, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gift-box-shape::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 20%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .gift-text {
            font-size: clamp(2rem, 6vw, 3rem);
            z-index: 2;
        }

        .open-button {
            padding: 1rem 2.5rem;
            font-size: clamp(1rem, 3vw, 1.3rem);
            background: linear-gradient(135deg, rgba(255, 110, 231, 0.3), rgba(193, 168, 255, 0.3));
            border: 2px solid;
            border-image: linear-gradient(135deg, #ff6ee7, #c1a8ff, #ff6ee7) 1;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(255, 110, 231, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            margin-top: 3rem;
            animation: fadeInScale 0.8s ease-out 0.3s both;
        }

        .open-button:hover {
            background: linear-gradient(135deg, rgba(255, 110, 231, 0.5), rgba(193, 168, 255, 0.5));
            box-shadow: 0 15px 40px rgba(255, 110, 231, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* ===== CELEBRATORY EFFECTS ===== */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            pointer-events: none;
        }

        .firework-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 90;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: clamp(1.5rem, 5vw, 3rem);
            animation: heartFloat 3s ease-out forwards;
        }

        @keyframes heartFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg);
                opacity: 0;
            }
        }

        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 85;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            animation: petalFall 4s ease-in forwards;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(0) translateX(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(var(--tx)) rotateZ(360deg);
                opacity: 0;
            }
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 80;
            pointer-events: none;
        }

        .confetti {
            position: absolute;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        /* ===== SCENE 4: LETTER ===== */
        #scene4 {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15) 0%, rgba(59, 130, 246, 0.1) 50%, #0a0e27 100%);
        }

        .letter-container {
            max-width: 90vw;
            width: 100%;
            max-height: 70vh;
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(193, 168, 255, 0.1), rgba(255, 110, 231, 0.05));
            border: 1px solid rgba(193, 168, 255, 0.3);
            border-radius: 20px;
            padding: clamp(1.5rem, 5vw, 3rem);
            box-shadow: 0 20px 60px rgba(193, 168, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            animation: fadeInScale 0.8s ease-out both;
        }

        .letter-text {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            line-height: 2;
            color: #e0c7ff;
            letter-spacing: 1px;
            min-height: 200px;
            animation: fadeIn 0.5s ease-out both;
        }

        .letter-char {
            animation: typeWriter 0.05s steps(1) forwards;
        }

        @keyframes typeWriter {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== SCENE 5: FINAL HEART ===== */
        #scene5 {
            background: radial-gradient(circle at 50% 50%, rgba(255, 110, 231, 0.1) 0%, rgba(147, 51, 234, 0.05) 50%, #0a0e27 100%);
        }

        .final-heart {
            position: relative;
            width: clamp(200px, 50vw, 400px);
            height: clamp(200px, 50vw, 400px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        .heart-shape {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 160%;
            background: linear-gradient(135deg, #ff6ee7, #c1a8ff);
            border-radius: 50% 50% 0 0;
            filter: drop-shadow(0 0 40px rgba(255, 110, 231, 0.6));
        }

        .heart-shape::before {
            left: 50%;
            transform: translate(-105%, 0) rotate(-45deg);
        }

        .heart-shape::after {
            right: 50%;
            transform: translate(105%, 0) rotate(45deg);
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.05); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.05); }
        }

        .final-text {
            position: absolute;
            width: 80%;
            text-align: center;
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: #fff;
            z-index: 10;
            line-height: 1.8;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* ===== CREDIT ===== */
        .credit {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: rgba(193, 168, 255, 0.6);
            z-index: 50;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== SCROLLBAR ===== */
        .letter-container::-webkit-scrollbar {
            width: 8px;
        }

        .letter-container::-webkit-scrollbar-track {
            background: rgba(193, 168, 255, 0.05);
            border-radius: 10px;
        }

        .letter-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #c1a8ff, #ff6ee7);
            border-radius: 10px;
        }

        .letter-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #e0c7ff, #ff8eb7);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .scene {
                flex-direction: column;
                padding: 1rem;
            }

            .glow-button,
            .open-button {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }

            .letter-container {
                max-height: 60vh;
            }

            .final-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Scene 1: Starry Night -->
    <div id="scene1" class="scene active">
        <div class="starfield" id="starfield"></div>
        <div class="particles" id="particles"></div>
        <div class="scene1-content">
            <h1 class="glow-title">في حد مستنيكي...</h1>
            <button class="glow-button" onclick="goToScene(2)">ابدئي الرحلة ❤️</button>
        </div>
    </div>

    <!-- Scene 2: Photo & Greeting -->
    <div id="scene2" class="scene">
        <div class="photo-frame">
            <div class="neon-circle">
                <div></div>
            </div>
            <img src="rody.jpg" alt="رودي" class="photo-img">
        </div>
        <p class="greeting-text">كل سنة وانتي بخير يا رودي</p>
        <button class="glow-button" onclick="goToScene(3)">التالي ➜</button>
    </div>

    <!-- Scene 3: Open Gift -->
    <div id="scene3" class="scene">
        <div class="gift-box">
            <div class="gift-box-shape">
                <span class="gift-text">🎁</span>
            </div>
        </div>
        <button class="open-button" onclick="openGift()">🎁 افتحي المفاجأة</button>
    </div>

    <!-- Scene 4: Letter -->
    <div id="scene4" class="scene">
        <div class="letter-container">
            <p class="letter-text" id="letterText"></p>
        </div>
    </div>

    <!-- Scene 5: Final Heart -->
    <div id="scene5" class="scene">
        <div class="final-heart">
            <div class="heart-shape"></div>
            <div class="final-text" id="finalText"></div>
        </div>
    </div>

    <!-- Celebratory Containers -->
    <div class="fireworks-container" id="fireworksContainer"></div>
    <div class="hearts-container" id="heartsContainer"></div>
    <div class="petals-container" id="petalsContainer"></div>
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Credit -->
    <div class="credit">Made with ❤️ by Karem</div>

    <script>
        // ===== SCENE MANAGEMENT =====
        let currentScene = 1;

        function showScene(sceneNum) {
            document.querySelectorAll('.scene').forEach(scene => {
                scene.classList.remove('active');
            });
            document.getElementById('scene' + sceneNum).classList.add('active');
            currentScene = sceneNum;
        }

        function goToScene(sceneNum) {
            if (sceneNum === 4) {
                typeWriterEffect();
            } else if (sceneNum === 5) {
                showFinalHeart();
            }
            showScene(sceneNum);
        }

        // ===== STARFIELD GENERATION =====
        function generateStars() {
            const starfield = document.getElementById('starfield');
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                starfield.appendChild(star);
            }

            for (let i = 0; i < 80; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.setProperty('--duration', (Math.random() * 6 + 4) + 's');
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                particle.style.setProperty('--ty', (Math.random() * 300 + 100) + 'px');
                particlesContainer.appendChild(particle);
            }
        }

        // ===== CELEBRATORY EFFECTS =====
        function createFireworks() {
            const container = document.getElementById('fireworksContainer');
            const colors = ['#ff6ee7', '#c1a8ff', '#00d4ff', '#7c3aed', '#ff00ff'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 50 + '%';

                    for (let j = 0; j < 12; j++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework-particle';
                        const angle = (j / 12) * Math.PI * 2;
                        const velocity = 5 + Math.random() * 5;
                        const tx = Math.cos(angle) * velocity * 50;
                        const ty = Math.sin(angle) * velocity * 50;

                        particle.style.width = '8px';
                        particle.style.height = '8px';
                        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                        particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
                        particle.style.animation = `fade-out 1s ease-out forwards`;
                        particle.style.left = '0';
                        particle.style.top = '0';
                        particle.style.transform = `translate(${tx}px, ${ty}px)`;

                        firework.appendChild(particle);
                    }

                    container.appendChild(firework);
                    setTimeout(() => firework.remove(), 1000);
                }, i * 50);
            }
        }

        function createHearts() {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                heart.style.setProperty('--ty', (Math.random() * -200 - 50) + 'px');
                
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }

        function createPetals() {
            const container = document.getElementById('petalsContainer');
            for (let i = 0; i < 40; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = '🌹';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.top = -50 + 'px';
                petal.style.setProperty('--tx', (Math.random() - 0.5) * 300 + 'px');
                petal.style.fontSize = Math.random() * 0.5 + 1 + 'rem';
                
                container.appendChild(petal);
                setTimeout(() => petal.remove(), 4000);
            }
        }

        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const confettiTypes = ['🎉', '✨', '⭐', '💫', '🎊'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.textContent = confettiTypes[Math.floor(Math.random() * confettiTypes.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -50 + 'px';
                confetti.style.fontSize = Math.random() * 1 + 1 + 'rem';
                
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function playAllEffects() {
            createFireworks();
            setTimeout(createHearts, 300);
            setTimeout(createPetals, 400);
            setTimeout(createConfetti, 500);
        }

        // ===== GIFT OPENING =====
        function openGift() {
            playAllEffects();
            playAudio();
            setTimeout(() => goToScene(4), 1500);
        }

        // ===== TYPEWRITER EFFECT =====
        const letterContent = `انتي واحدة من أجمل الناس اللي دخلوا حياتي
وجودك فرق معايا
يارب السنة دي تكون بداية لكل حاجة حلوة ليكي
وكل سنة وانتي بخير يا بنوتي ❤️`;

        function typeWriterEffect() {
            const letterText = document.getElementById('letterText');
            letterText.innerHTML = '';
            
            let charIndex = 0;
            function typeChar() {
                if (charIndex < letterContent.length) {
                    const char = letterContent[charIndex];
                    const span = document.createElement('span');
                    span.className = 'letter-char';
                    span.textContent = char;
                    letterText.appendChild(span);
                    charIndex++;
                    setTimeout(typeChar, 50);
                }
            }
            typeChar();
        }

        // ===== FINAL HEART DISPLAY =====
        function showFinalHeart() {
            const finalText = document.getElementById('finalText');
            finalText.textContent = `انتي واحدة من أجمل الناس اللي دخلوا حياتي
وجودك فرق معايا
يارب السنة دي تكون بداية لكل حاجة حلوة ليكي
وكل سنة وانتي بخير يا بنوتي ❤️`;
        }

        // ===== AUDIO =====
        function playAudio() {
            const audio = new Audio('birthday.mp3');
            audio.play().catch(e => console.log('Audio play failed:', e));
        }

        // ===== CSS ANIMATION INJECTION =====
        function injectCSSAnimations() {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fade-out {
                    from {
                        opacity: 1;
                        filter: drop-shadow(0 0 10px currentColor);
                    }
                    to {
                        opacity: 0;
                        filter: drop-shadow(0 0 0px currentColor);
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            generateStars();
            injectCSSAnimations();
        });

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentScene < 5) {
                    goToScene(currentScene + 1);
                }
            }
            if (e.key === 'ArrowLeft') {
                if (currentScene > 1) {
                    goToScene(currentScene - 1);
                }
            }
        });
    </script>
</body>
</html>
