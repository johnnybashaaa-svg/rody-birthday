<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد رودي ❤️</title>

<style>
body{
margin:0;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

.box{
text-align:center;
padding:25px;
max-width:400px;
}

button{
padding:15px 30px;
border:none;
border-radius:40px;
background:#ff4d8d;
color:white;
font-size:18px;
cursor:pointer;
}

#msg{
display:none;
margin-top:20px;
line-height:2;
font-size:20px;
}

.heart{
position:fixed;
font-size:25px;
animation:fall 6s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(110vh);}
}
</style>

</head>

<body>

<div class="box">

<h1>🎂 كل سنة وانتي بخير يا رودي ❤️</h1>

<p>اضغطي على الزر وافتحي المفاجأة</p>

<button onclick="showMsg()">🎁 افتحي المفاجأة</button>

<div id="msg">
كل سنة وانتي بخير يا بنوتي ❤️<br><br>
يارب السنة دي تكون أحلى سنة في حياتك.<br>
وتحققي كل اللي نفسك فيه.<br>
وتفضلي دايما مبتسمة وسعيدة.<br><br>
شكرا إنك موجودة في حياتي.<br><br>
❤️🎉
</div>

</div>

<script>

function showMsg(){
document.getElementById("msg").style.display="block";
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

</script>

</body>
</html>
