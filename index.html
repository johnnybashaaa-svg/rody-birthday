<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد رودي 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scene Container */
        .scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .scene-container.active {
            opacity: 1;
        }

        /* ===== SCENE 1: Night Sky with Stars ===== */
        #scene1 {
            background: linear-gradient(135deg, #0f0f23 0%, #1a0033 30%, #2d1b4e 60%, #1a0033 100%);
            position: relative;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            pointer-events: none;
        }

        .particle::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, #ff69b4, rgba(255, 105, 180, 0.1));
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
        }

        .title-container {
            text-align: center;
            z-index: 10;
            animation: fadeInScale 1.5s ease-out 0.5s both;
        }

        .glowing-title {
            font-size: clamp(28px, 8vw, 56px);
            color: #ff1493;
            text-shadow: 
                0 0 10px rgba(255, 20, 147, 0.8),
                0 0 20px rgba(255, 105, 180, 0.6),
                0 0 30px rgba(138, 43, 226, 0.4);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 
                    0 0 10px rgba(255, 20, 147, 0.8),
                    0 0 20px rgba(255, 105, 180, 0.6),
                    0 0 30px rgba(138, 43, 226, 0.4);
            }
            50% {
                text-shadow: 
                    0 0 20px rgba(255, 20, 147, 1),
                    0 0 40px rgba(255, 105, 180, 0.8),
                    0 0 60px rgba(138, 43, 226, 0.6);
            }
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            border: 2px solid rgba(255, 20, 147, 0.5);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 10px rgba(255, 20, 147, 0.6),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            animation: fadeInScale 1.5s ease-out 1.2s both;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 20px rgba(255, 20, 147, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== SCENE 2: Photo Scene ===== */
        #scene2 {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
        }

        .photo-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 40px;
            animation: photoZoomIn 1.2s ease-out;
        }

        @keyframes photoZoomIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .neon-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid;
            border-image: linear-gradient(135deg, #ff1493, #ff69b4, #8a2be2) 1;
            border-radius: 20px;
            box-shadow: 
                0 0 10px rgba(255, 20, 147, 0.4),
                0 0 20px rgba(255, 105, 180, 0.3),
                inset 0 0 20px rgba(138, 43, 226, 0.1);
            animation: neon-glow 3s ease-in-out infinite;
        }

        @keyframes neon-glow {
            0%, 100% {
                box-shadow: 
                    0 0 10px rgba(255, 20, 147, 0.4),
                    0 0 20px rgba(255, 105, 180, 0.3),
                    inset 0 0 20px rgba(138, 43, 226, 0.1);
            }
            50% {
                box-shadow: 
                    0 0 20px rgba(255, 20, 147, 0.6),
                    0 0 40px rgba(255, 105, 180, 0.5),
                    inset 0 0 30px rgba(138, 43, 226, 0.2);
            }
        }

        .photo-img {
            width: 100%;
            height: 100%;
            border-radius: 17px;
            object-fit: cover;
            animation: photoGlow 2s ease-in-out infinite;
            filter: brightness(1.2) contrast(1.1);
        }

        @keyframes photoGlow {
            0%, 100% {
                filter: brightness(1.2) contrast(1.1) drop-shadow(0 0 10px rgba(255, 105, 180, 0.4));
            }
            50% {
                filter: brightness(1.3) contrast(1.2) drop-shadow(0 0 25px rgba(255, 105, 180, 0.7));
            }
        }

        .greeting-text {
            font-size: clamp(18px, 5vw, 32px);
            color: #ff69b4;
            text-shadow: 
                0 0 10px rgba(255, 105, 180, 0.6),
                0 0 20px rgba(138, 43, 226, 0.4);
            font-weight: 600;
            animation: fadeInScale 1.2s ease-out 0.5s both;
        }

        /* ===== SCENE 3: Gift Button ===== */
        #scene3 {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
        }

        .gift-button {
            padding: 20px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #8a2be2 100%);
            border: 3px solid rgba(255, 20, 147, 0.6);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 20px rgba(255, 20, 147, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: bounceIn 1s ease-out;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .gift-button:hover {
            transform: scale(1.1);
            box-shadow: 
                0 0 40px rgba(255, 20, 147, 1),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .gift-button:active {
            transform: scale(0.95);
        }

        /* ===== SCENE 4: Letter Scene ===== */
        #scene4 {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
            padding: 20px;
        }

        .letter-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(26, 0, 51, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(255, 105, 180, 0.3),
                inset 0 0 20px rgba(138, 43, 226, 0.1);
            animation: slideInUp 1s ease-out;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .letter-text {
            font-size: clamp(16px, 4vw, 20px);
            color: #ff69b4;
            line-height: 2;
            text-align: center;
            min-height: 300px;
            letter-spacing: 1px;
        }

        .letter-char {
            animation: charAppear 0.05s ease-out forwards;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        @keyframes charAppear {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ===== SCENE 5: Heart & Final Message ===== */
        #scene5 {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
            padding: 20px;
        }

        .heart-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            animation: heartBeat 1.2s ease-in-out infinite;
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 30%, #ff1493, #ff69b4, #8a2be2);
            clip-path: polygon(
                50% 100%, 
                0% 38%, 
                0% 0%, 
                50% 0%, 
                50% 0%, 
                100% 0%, 
                100% 38%, 
                50% 100%
            );
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            animation: heartGlow 2s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
        }

        @keyframes heartGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(255, 20, 147, 1));
            }
        }

        .final-message {
            font-size: clamp(14px, 4vw, 18px);
            color: #ff69b4;
            text-align: center;
            max-width: 500px;
            line-height: 2;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
            animation: fadeInScale 1.5s ease-out;
        }

        /* ===== SCENE 6: Credits ===== */
        #scene6 {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
        }

        .credit-text {
            font-size: 24px;
            color: #ff69b4;
            text-shadow: 
                0 0 15px rgba(255, 105, 180, 0.8),
                0 0 30px rgba(138, 43, 226, 0.5);
            animation: fadeInScale 1.5s ease-out;
        }

        /* ===== Effects ===== */
        .fireworks {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .firework {
            position: absolute;
            pointer-events: none;
        }

        .heart-float {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            animation: floatUp 3s ease-in forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--drift, 0)) scale(0);
                opacity: 0;
            }
        }

        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff69b4;
            border-radius: 50%;
            pointer-events: none;
            animation: fallingPetal 4s linear forwards;
        }

        @keyframes fallingPetal {
            0% {
                transform: translateY(-100vh) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            pointer-events: none;
            animation: confettiFall 4s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .start-btn, .gift-button {
                padding: 12px 30px;
                font-size: 16px;
            }

            .photo-container {
                width: 200px;
                height: 200px;
            }

            .letter-container {
                padding: 30px 20px;
            }

            .heart-container {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .glowing-title {
                margin-bottom: 30px;
            }

            .start-btn, .gift-button {
                padding: 10px 25px;
                font-size: 14px;
            }

            .photo-container {
                width: 160px;
                height: 160px;
                margin-bottom: 30px;
            }

            .letter-container {
                padding: 20px 15px;
            }

            .heart-container {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- SCENE 1: Night Sky -->
    <div id="scene1" class="scene-container active">
        <div class="particles" id="particles"></div>
        <div class="title-container">
            <h1 class="glowing-title">في حد مستنيكي...</h1>
            <button class="start-btn" onclick="goToScene(2)">ابدئي الرحلة ❤️</button>
        </div>
    </div>

    <!-- SCENE 2: Photo -->
    <div id="scene2" class="scene-container">
        <div class="photo-container">
            <div class="neon-frame"></div>
            <img src="rody.jpg" alt="رودي" class="photo-img">
        </div>
        <p class="greeting-text">كل سنة وانتي بخير يا رودي</p>
        <button class="start-btn" style="margin-top: 40px;" onclick="goToScene(3)">التالي →</button>
    </div>

    <!-- SCENE 3: Gift Button -->
    <div id="scene3" class="scene-container">
        <button class="gift-button" onclick="celebrateAndGoToScene(4)">🎁 افتحي المفاجأة</button>
    </div>

    <!-- SCENE 4: Letter -->
    <div id="scene4" class="scene-container">
        <div class="letter-container">
            <div class="letter-text" id="letterText"></div>
        </div>
        <button class="start-btn" style="margin-top: 40px;" onclick="goToScene(5)">التالي →</button>
    </div>

    <!-- SCENE 5: Heart & Message -->
    <div id="scene5" class="scene-container">
        <div class="heart-container">
            <div class="heart"></div>
        </div>
        <p class="final-message">انتي واحدة من أجمل الناس اللي دخلوا حياتي<br>وجودك فرق معايا<br>يارب السنة دي تكون بداية لكل حاجة حلوة ليكي<br>وكل سنة وانتي بخير يا بنوتي ❤️</p>
        <button class="start-btn" style="margin-top: 40px;" onclick="goToScene(6)">الخاتمة</button>
    </div>

    <!-- SCENE 6: Credits -->
    <div id="scene6" class="scene-container">
        <p class="credit-text">Made with ❤️ by Karem</p>
        <button class="start-btn" style="margin-top: 40px;" onclick="goToScene(1)">ابدئي من جديد</button>
    </div>

    <script>
        // ===== Scene Navigation =====
        function goToScene(sceneNumber) {
            // Hide all scenes
            document.querySelectorAll('.scene-container').forEach(scene => {
                scene.classList.remove('active');
            });

            // Show target scene
            const targetScene = document.getElementById(`scene${sceneNumber}`);
            if (targetScene) {
                targetScene.classList.add('active');

                // Special logic for scene 4 (letter)
                if (sceneNumber === 4) {
                    setTimeout(typeLetterAnimation, 500);
                }
            }
        }

        // ===== Celebrate & Transition =====
        function celebrateAndGoToScene(sceneNumber) {
            // Play music
            const audio = new Audio('birthday.mp3');
            audio.play().catch(e => console.log('Audio play error:', e));

            // Create fireworks
            createFireworks();

            // Create floating hearts
            createFloatingHearts();

            // Create falling petals
            createFallingPetals();

            // Create confetti
            createConfetti();

            // Transition to next scene
            setTimeout(() => {
                goToScene(sceneNumber);
            }, 1500);
        }

        // ===== Fireworks Effect =====
        function createFireworks() {
            const container = document.getElementById('scene3');
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    
                    const x = Math.random() * 100;
                    const y = Math.random() * 50 + 25;
                    
                    firework.style.left = x + '%';
                    firework.style.top = y + '%';
                    firework.style.width = '10px';
                    firework.style.height = '10px';
                    firework.style.background = ['#ff1493', '#ff69b4', '#8a2be2', '#00ffff', '#ffd700'][Math.floor(Math.random() * 5)];
                    firework.style.borderRadius = '50%';
                    firework.style.boxShadow = `0 0 10px ${firework.style.background}`;
                    
                    const angle = (Math.PI * 2 * i) / 30;
                    const velocity = 5 + Math.random() * 5;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    let px = parseInt(firework.style.left);
                    let py = parseInt(firework.style.top);
                    let life = 1;
                    
                    const animate = () => {
                        px += vx;
                        py += vy;
                        life -= 0.02;
                        
                        firework.style.left = px + 'px';
                        firework.style.top = py + 'px';
                        firework.style.opacity = life;
                        
                        if (life > 0) {
                            requestAnimationFrame(animate);
                        } else {
                            firework.remove();
                        }
                    };
                    
                    container.appendChild(firework);
                    animate();
                }, i * 30);
            }
        }

        // ===== Floating Hearts =====
        function createFloatingHearts() {
            const container = document.getElementById('scene3');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.bottom = '-50px';
                heart.style.setProperty('--drift', (Math.random() - 0.5) * 200 + 'px');
                heart.style.animation = `floatUp ${2 + Math.random() * 2}s ease-in forwards`;
                
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 5000);
            }
        }

        // ===== Falling Petals =====
        function createFallingPetals() {
            const container = document.getElementById('scene3');
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.left = Math.random() * 100 + '%';
                    petal.style.top = '-20px';
                    petal.style.animation = `fallingPetal ${3 + Math.random() * 2}s linear forwards`;
                    
                    container.appendChild(petal);
                    
                    setTimeout(() => petal.remove(), 5000);
                }, i * 100);
            }
        }

        // ===== Confetti =====
        function createConfetti() {
            const container = document.getElementById('scene3');
            const colors = ['#ff1493', '#ff69b4', '#8a2be2', '#00ffff', '#ffd700', '#00ff00'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.width = (5 + Math.random() * 5) + 'px';
                confetti.style.height = (5 + Math.random() * 5) + 'px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confettiFall ${3 + Math.random() * 2}s linear forwards`;
                
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // ===== Letter Typewriter Animation =====
        function typeLetterAnimation() {
            const letterText = "انتي واحدة من أجمل الناس اللي دخلوا حياتي\nوجودك فرق معايا\nيارب السنة دي تكون بداية لكل حاجة حلوة ليكي\nوكل سنة وانتي بخير يا بنوتي ❤️";
            const letterContainer = document.getElementById('letterText');
            
            letterContainer.innerHTML = '';
            
            const chars = letterText.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'letter-char';
                span.textContent = char;
                span.style.animationDelay = (index * 50) + 'ms';
                
                letterContainer.appendChild(span);
            });
        }

        // ===== Create Animated Stars =====
        function createStars() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                
                particlesContainer.appendChild(star);
            }

            // Floating particles
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `floatAround ${10 + Math.random() * 10}s ease-in-out infinite`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Animation for particles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatAround {
                0%, 100% { transform: translate(0, 0); opacity: 0.3; }
                25% { transform: translate(100px, -100px); opacity: 0.6; }
                50% { transform: translate(50px, 100px); opacity: 0.3; }
                75% { transform: translate(-100px, -50px); opacity: 0.6; }
            }
        `;
        document.head.appendChild(style);

        // Initialize
        window.addEventListener('load', () => {
            createStars();
        });

        // Preload image
        window.addEventListener('load', () => {
            const img = new Image();
            img.src = 'rody.jpg';
        });
    </script>
</body>
</html>
